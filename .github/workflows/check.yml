name: Validate
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm audit --omit=dev
      - run: npm ci --prefix site
      - run: npm --prefix site run build
      - run: node --check site/public/app.js
      - run: node site/node_modules/wrangler/bin/wrangler.js deploy --config site/wrangler.jsonc --dry-run
      - if: runner.os == 'Windows'
        run: npm run test:teams-browser
